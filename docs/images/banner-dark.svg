      <path d="M -150 198 Q 130 192, 410 198 T 890 198 T 1450 198" stroke="#58a6ff" stroke-opacity="0.32" stroke-width="1.6" fill="none" />
      <path d="M -150 212 Q 170 205, 470 212 T 970 212 T 1450 212" stroke="#79c0ff" stroke-opacity="0.24" stroke-width="1.3" fill="none" />
    </g>

    <path d="M 0 240 Q 250 215, 600 235 T 1200 220 L 1200 300 L 0 300 Z" fill="url(#d-sand)" />

    <g class="wave-shore-foam">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="5.5s" repeatCount="indefinite" />
      <path d="M -50 238 Q 250 213, 600 233 T 1250 218" stroke="#79c0ff" stroke-opacity="0.5" stroke-width="2.5" fill="none" />
      <path d="M -50 241 Q 250 216, 600 236 T 1250 221" stroke="#f0f6fc" stroke-opacity="0.25" stroke-width="1.4" fill="none" />
    </g>

