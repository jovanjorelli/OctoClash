<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="d-sky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="50%" stop-color="#060c18" />
      <stop offset="85%" stop-color="#0d1829" />
      <stop offset="100%" stop-color="#112238" />
    </linearGradient>

    <linearGradient id="d-sea" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a" />
      <stop offset="60%" stop-color="#091420" />
      <stop offset="100%" stop-color="#060e17" />
    </linearGradient>

    <linearGradient id="d-sand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="d-moon-aura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6fc" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0.5" />
    </linearGradient>

    <radialGradient id="d-moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#388bfd" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#060c18" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="d-water-reflection" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="d-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.8" />
    </linearGradient>

    <clipPath id="d-rounded">
      <rect x="1" y="1" width="1198" height="298" rx="28" />
    </clipPath>

    <mask id="d-moon-mask">
      <rect x="1000" y="20" width="120" height="120" fill="#ffffff" />
      <circle cx="1051" cy="62" r="21" fill="#000000" />
    </mask>

    <style>
      @keyframes oceanSwayBack {
        0%, 100% { transform: translateX(0) translateY(0); }
        50% { transform: translateX(-42px) translateY(-2px); }
      }
      @keyframes oceanSwayMid {
        0%, 100% { transform: translateX(0) translateY(0); }
        50% { transform: translateX(36px) translateY(2px); }
      }
      @keyframes shoreFoamLap {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .wave-sway-back { animation: oceanSwayBack 7s ease-in-out infinite; }
      .wave-sway-mid { animation: oceanSwayMid 9s ease-in-out infinite; }
      .wave-shore-foam { animation: shoreFoamLap 5.5s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#d-rounded)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#d-sky)" />

    <circle cx="1060" cy="68" r="95" fill="url(#d-moon-glow)" />
    <circle cx="1060" cy="68" r="23" fill="url(#d-moon-aura)" mask="url(#d-moon-mask)" />

    <path d="M 120 52 L 175 36 L 240 68 L 218 110 L 144 94 Z M 240 68 L 300 48" stroke="#79c0ff" stroke-opacity="0.6" stroke-dasharray="4 3" stroke-width="1.4" fill="none" />

    <g>
      <circle cx="120" cy="52" r="6" fill="#79c0ff" fill-opacity="0.35" />
