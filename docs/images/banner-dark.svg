    <rect x="0" y="170" width="1200" height="130" fill="url(#d-sea)" />
    <ellipse cx="1060" cy="180" rx="140" ry="20" fill="url(#d-water-reflection)" opacity="0.85" />

    <g class="wave-sway-back">
      <animateTransform attributeName="transform" type="translate" values="0,0; -42,-2; 0,0" dur="7s" repeatCount="indefinite" />
      <path d="M -150 183 Q 80 177, 310 183 T 750 183 T 1190 183 T 1450 183" stroke="#388bfd" stroke-opacity="0.4" stroke-width="1.8" fill="none" />
    </g>

    <g class="wave-sway-mid">
