    <circle cx="65" cy="122" r="1.5" fill="#ffffff" opacity="0.75" />
    <circle cx="95" cy="38" r="1.2" fill="#79c0ff" opacity="0.7" />
    <circle cx="350" cy="78" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="410" cy="32" r="1.2" fill="#ffffff" opacity="0.65" />
    <circle cx="475" cy="70" r="1.6" fill="#79c0ff" opacity="0.75" />
    <circle cx="530" cy="26" r="1.3" fill="#ffffff" opacity="0.7" />
    <circle cx="670" cy="30" r="1.5" fill="#ffffff" opacity="0.7" />
    <circle cx="730" cy="74" r="1.4" fill="#79c0ff" opacity="0.8" />
    <circle cx="795" cy="38" r="1.8" fill="#ffffff" opacity="0.85" />
    <circle cx="860" cy="92" r="1.5" fill="#ffffff" opacity="0.7" />
    <circle cx="920" cy="34" r="1.7" fill="#79c0ff" opacity="0.8" />
    <circle cx="970" cy="108" r="1.3" fill="#ffffff" opacity="0.65" />
    <circle cx="1010" cy="40" r="1.5" fill="#ffffff" opacity="0.75" />
    <circle cx="1130" cy="46" r="1.6" fill="#ffffff" opacity="0.8" />
    <circle cx="1165" cy="110" r="1.3" fill="#79c0ff" opacity="0.7" />
    <circle cx="60" cy="72" r="1.2" fill="#ffffff" opacity="0.65" />
    <circle cx="190" cy="130" r="1.2" fill="#79c0ff" opacity="0.65" />
    <circle cx="280" cy="118" r="1.4" fill="#ffffff" opacity="0.7" />
