<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="l-sky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f0f6fc" />
      <stop offset="40%" stop-color="#e1f1fe" />
      <stop offset="75%" stop-color="#d0ecfd" />
      <stop offset="100%" stop-color="#b6e3ff" />
    </linearGradient>

    <linearGradient id="l-sea" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#80ccff" />
      <stop offset="50%" stop-color="#54aeff" />
      <stop offset="100%" stop-color="#218bff" />
    </linearGradient>

    <linearGradient id="l-sand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="60%" stop-color="#f4eee4" />
      <stop offset="100%" stop-color="#e8e0d3" />
    </linearGradient>

    <radialGradient id="l-sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd33d" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#fff8c5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d0ecfd" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="l-sun-reflection" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#ffd33d" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#54aeff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="l-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0d7de" />
      <stop offset="50%" stop-color="#54aeff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#d0d7de" />
    </linearGradient>

    <clipPath id="l-rounded">
      <rect x="1" y="1" width="1198" height="298" rx="28" />
    </clipPath>

    <style>
      @keyframes sunpulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      .sun-aura { animation: sunpulse 5s ease-in-out infinite; transform-origin: 1060px 68px; }

      @keyframes oceanSwayBack {
        0%, 100% { transform: translateX(0) translateY(0); }
        50% { transform: translateX(-42px) translateY(-2px); }
      }
      @keyframes oceanSwayMid {
        0%, 100% { transform: translateX(0) translateY(0); }
        50% { transform: translateX(36px) translateY(2px); }
      }
      @keyframes shoreFoamLap {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .wave-sway-back { animation: oceanSwayBack 7s ease-in-out infinite; }
      .wave-sway-mid { animation: oceanSwayMid 9s ease-in-out infinite; }
      .wave-shore-foam { animation: shoreFoamLap 5.5s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#l-rounded)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#l-sky)" />

    <circle cx="1060" cy="68" r="110" fill="url(#l-sun-glow)" class="sun-aura" />
    <circle cx="1060" cy="68" r="24" fill="#ffd33d" />
    <circle cx="1060" cy="68" r="22" fill="#fff8c5" opacity="0.6" />

    <path d="M180 65 Q 186 60, 192 65 Q 198 60, 204 65" stroke="#57606a" stroke-width="1.2" fill="none" opacity="0.4" />
    <path d="M220 78 Q 225 74, 230 78 Q 235 74, 240 78" stroke="#57606a" stroke-width="1" fill="none" opacity="0.3" />
    <path d="M920 52 Q 925 48, 930 52 Q 935 48, 940 52" stroke="#57606a" stroke-width="1.2" fill="none" opacity="0.35" />

    <rect x="0" y="170" width="1200" height="130" fill="url(#l-sea)" />
    <ellipse cx="1060" cy="182" rx="140" ry="24" fill="url(#l-sun-reflection)" />

    <g class="wave-sway-back">
      <animateTransform attributeName="transform" type="translate" values="0,0; -42,-2; 0,0" dur="7s" repeatCount="indefinite" />
      <path d="M -150 183 Q 80 177, 310 183 T 750 183 T 1190 183 T 1450 183" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2" fill="none" />
    </g>

    <g class="wave-sway-mid">
      <animateTransform attributeName="transform" type="translate" values="0,0; 36,2; 0,0" dur="9s" repeatCount="indefinite" />
      <path d="M -150 198 Q 130 192, 410 198 T 890 198 T 1450 198" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.6" fill="none" />
      <path d="M -150 212 Q 170 205, 470 212 T 970 212 T 1450 212" stroke="#54aeff" stroke-opacity="0.5" stroke-width="1.3" fill="none" />
    </g>

    <path d="M 0 240 Q 250 215, 600 235 T 1200 220 L 1200 300 L 0 300 Z" fill="url(#l-sand)" />

    <g class="wave-shore-foam">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="5.5s" repeatCount="indefinite" />
      <path d="M -50 238 Q 250 213, 600 233 T 1250 218" stroke="#ffffff" stroke-width="3.5" opacity="0.95" fill="none" />
      <path d="M -50 241 Q 250 216, 600 236 T 1250 221" stroke="#d0ecfd" stroke-width="1.8" opacity="0.7" fill="none" />
    </g>

    <g opacity="0.04" stroke="#0969da" stroke-width="1">
      <line x1="200" y1="0" x2="200" y2="300" />
      <line x1="400" y1="0" x2="400" y2="300" />
      <line x1="600" y1="0" x2="600" y2="300" />
      <line x1="800" y1="0" x2="800" y2="300" />
      <line x1="1000" y1="0" x2="1000" y2="300" />
      <line x1="0" y1="100" x2="1200" y2="100" />
      <line x1="0" y1="200" x2="1200" y2="200" />
    </g>

    <g transform="translate(600, 114)">
      <g transform="translate(-149, -22)">
        <svg width="44" height="44" viewBox="0 0 16 16" fill="#1f2328">
          <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z" />
        </svg>
      </g>
      <text x="-91" y="3" dominant-baseline="central" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#1f2328" letter-spacing="-1">OctoClash</text>
    </g>

    <g transform="translate(600, 168)" text-anchor="middle">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17.5" font-weight="500" fill="#24292f" letter-spacing="-0.2">
        GitHub Repository Benchmarking &amp; Intelligence Suite
      </text>
    </g>

    <g transform="translate(600, 268)" text-anchor="middle">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0969da" letter-spacing="1.5">
        52-WEEK VELOCITY • HEALTH GRADES • REVERSE NPM METRICS • BATTLE CARDS
      </text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="28" fill="none" stroke="url(#l-border)" stroke-width="1.5" />
</svg>
